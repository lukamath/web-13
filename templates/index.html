<!DOCTYPE html>
<html>
<head>
    <title>Word 13</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tempus Dominus CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tempus-dominus/6.2.7/css/tempus-dominus.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles/style.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles/dogebutton.min.css') }}">
</head>
<body>
    <div class="message-box">
        <h1><img src="{{ url_for('static', filename='img/w13_mainlogo.png') }}" alt="word 13"></h1>
        <form method="POST" onsubmit="return validateInput();">
            <br>
            <div class="user-box">
                <label>Message</label>  
                <textarea id="input_text" name="input_text" rows="5" cols="40" oninput="updateInput();"></textarea>    
                <label>Signature</label>
                <input type="text" id="username" name="username">    
            </div>
            <div class="form-group">
                <label for="date_time">Date and Time:</label>
                <input type="text" id="date_time" name="date_time" class="form-control" required>
            </div>
            <div><datetime-slot-picker 
                      placeholder="Pick a time slot" 
                      time-slots-text="Time"
                      no-slots-text="No slots are available" 
                      time-format="HH:mm"
                      dates-hidden-when-times-shown
                      >
                </datetime-slot-picker></div>
            <input type="submit" class="send-button" id="send-button" value="Send">
            <div class="counter-box">
                <p>Character Count: <span id="char_count">0</span></p>
                <p>Word Count: <span id="word_count">0</span></p>
            </div>       
        </form>
    </div>
    <div class="bottom-box">
        <div data-xdgbtn-address="D6U7eTceRUace37ySXfAMgHtehMMNmiC7t" class="xdgbtn-donate xdgbtn-theme-corpo xdgbtn-black"></div>
        <script type="text/javascript" src="static/js/dogebutton.min.js"></script>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.7/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    <!-- Tempus Dominus JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tempus-dominus/6.2.7/js/tempus-dominus.min.js"></script>
    <!-- Font Awesome for the calendar icon -->
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    <script src='https://unpkg.com/datetime-slot-picker/dist/datetime-slot-picker/datetime-slot-picker.js'></script>

    <script>
       const datetimeSlotPicker = document.querySelector('datetime-slot-picker');


// Event listener for when the slot picker is updated
datetimeSlotPicker.addEventListener('slotUpdate', function(event) {
    const selectedDate = 'Thu, 26 Nov 2020'; // Assuming event.detail has the selectedDate
    console.log('Updated Slot:', event.detail);

    // Set the new slots based on the selected date and 1-hour interval
    datetimeSlotPicker.slots = [
        {
            date: 'Thu, 26 Nov 2020',
                //timeSlots: generateTimeSlots(10, 17) // Generate slots from 10:00 AM to 5:00 PM
            timeSlots: [
            '10:00 AM',
            '11:00 AM',
            '4:00 PM',
            '5:00 PM'
            ]
        }
    ];
});


</script>


</body>
</html>
