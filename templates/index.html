<!DOCTYPE html>
<html>
<head>
    <title>Word 13</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tempus Dominus CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tempus-dominus/6.2.7/css/tempus-dominus.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles/style.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles/dogebutton.min.css') }}">
</head>
<body>
    <div class="message-box">
        <h1><img src="{{ url_for('static', filename='img/w13_mainlogo.png') }}" alt="word 13"></h1>
        <form method="POST" onsubmit="return validateInput();">
            <br>
            <div class="user-box">
                <label>Message</label>  
                <textarea id="input_text" name="input_text" rows="5" cols="40" oninput="updateInput();"></textarea>    
                <label>Signature</label>
                <input type="text" id="username" name="username">    
            </div>
            <div class="form-group">
                <label for="date_time">Date and Time:</label>
                <input type="text" id="date_time" name="date_time" class="form-control" required>
            </div>
            <input type="submit" class="send-button" id="send-button" value="Send">
            <div class="counter-box">
                <p>Character Count: <span id="char_count">0</span></p>
                <p>Word Count: <span id="word_count">0</span></p>
            </div>       
        </form>
    </div>
    <div class="bottom-box">
        <div data-xdgbtn-address="D6U7eTceRUace37ySXfAMgHtehMMNmiC7t" class="xdgbtn-donate xdgbtn-theme-corpo xdgbtn-black"></div>
        <script type="text/javascript" src="static/js/dogebutton.min.js"></script>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.7/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    <!-- Tempus Dominus JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tempus-dominus/6.2.7/js/tempus-dominus.min.js"></script>
    <!-- Font Awesome for the calendar icon -->
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize the datetime picker
            const datepickerElement = document.getElementById('date_time');
            const datetimepicker = new tempusDominus.TempusDominus(datepickerElement, {
                useCurrent: false,
                stepping: 10, // 10-minute intervals
                display: {
                    components: {
                        calendar: true,
                        date: true,
                        month: true,
                        year: true,
                        decades: true,
                        clock: true,
                        hours: true,
                        minutes: true,
                        seconds: false
                    }
                }
            });

            // Fetch occupied slots and apply them
            function updatePickerWithOccupiedSlots() {
                fetch('/api/occupied_slots')
                    .then(response => response.json())
                    .then(occupiedSlots => {
                        // Convert occupied slots to an array of {date, time} objects
                        const disabledTimes = occupiedSlots.map(slot => new Date(slot));

                        // Disable specific times on selected dates
                        datetimepicker.updateOptions({
                            restrictions: {
                                disabledDates: function (date) {
                                    return disabledTimes.some(disabled => (
                                        date.getFullYear() === disabled.getFullYear() &&
                                        date.getMonth() === disabled.getMonth() &&
                                        date.getDate() === disabled.getDate() &&
                                        date.getHours() === disabled.getHours() &&
                                        date.getMinutes() === disabled.getMinutes()
                                    ));
                                }
                            }
                        });
                    });
            }

            // Initial update
            updatePickerWithOccupiedSlots();

            // Re-fetch and update the picker whenever a new date is selected
            datepickerElement.addEventListener('change', updatePickerWithOccupiedSlots);
        });

        function validateInput() {
            var textArea = document.getElementById('input_text');
            var usernameField = document.getElementById('username');
            var charCount = textArea.value.length;
            var wordCount = textArea.value.trim().split(/\s+/).length;
            var errorDiv = document.getElementById('error_message');

            if (usernameField.value === "") {
                errorDiv.style.display = 'block'; // Show the error message
                errorDiv.innerHTML = "Please enter a username.";
                return false;
            } else if (wordCount > 10 || charCount > 109) {
                errorDiv.style.display = 'block'; // Show the error message
                errorDiv.innerHTML = "You've reached the limit of 10 words or 100 characters.";
                return false;
            } else {
                errorDiv.innerHTML = "";
            }
            return true;
        }

        function updateInput() {
            var textArea = document.getElementById('input_text');
            var charCount = textArea.value.length;
            var wordCount = textArea.value.trim().split(/\s+/).length;
            var errorDiv = document.getElementById('error_message');

            var words = textArea.value.split(' ');

            for (var i = 0; i < words.length; i++) {
                if (words[i].length > 10) {
                    alert("Word truncated to 10 characters: " + words[i].slice(0, 10));
                    words[i] = words[i].slice(0, 10);
                }
            }

            if (charCount > 100) {
                errorDiv.style.display = 'block'; // Show the error message
                errorDiv.innerHTML = "You've reached the limit of 100 characters.";
                textArea.value = textArea.value.slice(0, 100);
            } else {
                errorDiv.innerHTML = "";
            }

            textArea.value = words.join(' ');

            var wordsArray = textArea.value.trim().split(/\s+/);
            if (wordsArray.length > 10) {
                wordsArray = wordsArray.slice(0, 10);
                textArea.value = wordsArray.join(' ');
                errorDiv.style.display = 'block'; // Show the error message
                errorDiv.innerHTML = "You've reached the limit of 10 words.";
            } else {
                errorDiv.innerHTML = "";
            }

            var wordCountSpan = document.getElementById('word_count');
            wordCountSpan.innerHTML = wordsArray.length;

            var charCountSpan = document.getElementById('char_count');
            charCountSpan.innerHTML = charCount;
        }
    </script>
</body>
</html>
